<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="scriptt.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="start">
        <button class = "bt">start game?</button>
    </div>
    <div class="container">
        
        <h1 class = "heading">rock paper scissors</h1>
        <h3>choose your weapon</h3>
        <div class="choice">
            <button class="rock">rock</button>
            <button class="paper">paper</button>
            <button class="scissors">scissors</button>
        </div>
        <div class="comp">
            <div >machine chose:</div>
            <span class="compchoice"></span>
        </div>
        <div class="you">
            <div >you chose: </div>
            <span class="yourchoice"></span>
        </div>
        <div class="outcome">this is the outcome</div>
        <div class="score">
            <div class="human"> - </div>
            <div class="machine"> - </div>
        </div>
        <div class="result">
            right now no result
        </div>
    </div>
    <div class="endpage">
        <h1 class="winlose">hallo u won</h1>
        <button class="replay">play again?</button>
        <div>score:</div>
        <div class="scr"></div>
    </div>
</body>

</html>
